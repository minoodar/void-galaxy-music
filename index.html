<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://minoodar.github.io/void/">
  <title>Void has moved</title>
  <meta http-equiv="refresh" content="1; url=https://minoodar.github.io/void/">
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 42%, #0a0d1c 0%, #05060f 58%, #020309 100%);
      color: rgba(235, 240, 245, .88);
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    main { max-width: 30rem; }
    h1 { margin: 0 0 .6rem; font-size: 1.45rem; font-weight: 600; letter-spacing: .01em; color: #f4f7fb; }
    p { margin: 0 0 .5rem; }
    a { color: #cbb3ff; text-underline-offset: .2em; }
    a:hover { color: #e6d9ff; }
    a:focus-visible { outline: 2px solid rgba(220, 230, 240, .85); outline-offset: 3px; border-radius: 4px; }
  </style>
  <script>
    (function () {
      var target = 'https://minoodar.github.io/void/';
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      window.location.replace(target + search + hash);
    })();
  </script>
</head>
<body>
  <main>
    <h1>Void has moved</h1>
    <p>The project is now at <a href="https://minoodar.github.io/void/">minoodar.github.io/void</a>.</p>
    <p>You are being redirected; links that carried a letter id keep it.</p>
  </main>
</body>
</html>
